name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build exe
        run: >
          pyinstaller --onefile --console --clean
          --name FM27TacticsLab
          --paths app
          --add-data "app/web;web"
          --collect-submodules fmsave
          --hidden-import lab_reader
          app/tactics_lab.py

      - name: Self-test the exe
        run: dist\FM27TacticsLab.exe --selftest

      - uses: actions/upload-artifact@v4
        with:
          name: FM27TacticsLab
          path: dist/FM27TacticsLab.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FM27TacticsLab.exe
          generate_release_notes: true
